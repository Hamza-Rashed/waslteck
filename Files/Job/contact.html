<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            text-align: right;
            
        }
        .form-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            direction: rtl;
        }
        .form-title {
            text-align: center;
            margin-bottom: 20px;
            color: #ff6600;
        }
        .form-sec{
         text-align: center;
            margin-bottom: 20px;
            color: #656565;
            font-family: Arial, Helvetica, sans-serif;
        }
        .btn-custom {
            background-color: #ff6600;
            color: white;
            border: none;
        }
        .btn-custom:hover {
            background-color: #e65c00;
        }
        .form-label {
            color: #333;
        }
        .linn{
         text-decoration: none;
        }
        @media (max-width: 768px){
            .form-container{
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2 class="form-title">تسجيل الدخول</h2>
            <h5 class="form-sec">سجل دخولك لتتمكن من إنشاء وظيفة جديدة أو التقديم على أي وظيفة أو يمكنك الضغط على الرقم التالي <a href="tel:+962796838462">0796838462</a> ليقوم موظف المركز بالمساعدة</h5>
            <form>
                <div class="form-group">
                    <label for="transportationName" class="form-label">الاسم الثلاثي (اسمك واسم الاب واسم العائلة)</label>
                    <input type="text" class="form-control" id="transportationName" name="transportationName" required>
                </div>
                <div class="form-group">
                    <label for="capacity" class="form-label">رقم الهاتف فعال للاتصال</label>
                    <input type="text" class="form-control" id="capacity" name="transportationName" required>
                </div>
                <div class="form-group">
                  <label for="capacity" class="form-label">المواليد</label>
                  <input type="date" class="form-control" id="capacity" name="transportationName" required>
              </div>
            <div class="form-group">
              <label for="transportationType" class="form-label">الجنس</label>
              <select class="form-control" id="transportationType" name="transportationName" required>
                  <option>حدد الجنس</option>
                  <option>ذكر</option>
                  <option>انثى</option>
              </select>
          </div>
          <div class="form-group">
            <label for="transportationName" class="form-label">رقم القطاع</label>
            <input type="text" class="form-control" id="transportationName" name="transportationName" required>
        </div>
        <div class="form-group">
          <label for="transportationName" class="form-label">رقم الحارة</label>
          <input type="text" class="form-control" id="transportationName" name="transportationName" required>
      </div>
      <div class="form-group">
        <label for="transportationName" class="form-label">رقم المنزل</label>
        <input type="text" class="form-control" id="transportationName" name="transportationName" required>
    </div>
                <div class="form-group">
                    <label for="description" class="form-label">يرجى ذكر أي تفاصيل إضافية ترغب بأن يراها صاحب العمل أو إذا كنت صاحب عمل اكتب أي تفاصيل ترغب بأن يراهل العامل</label>
                    <textarea class="form-control" id="description" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-custom btn-block">تسجيل</button> <br>
                
            </form>
            <a href="./index.html" class="linn"><button class="btn btn-custom btn-block">إالغاء والعودة للصفحة الرئيسية</button></a>
        </div>
    </div>
</body>
</html>
