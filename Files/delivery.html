<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Input Elements</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2>Bootstrap Input Examples</h2>
    
    <div class="mb-3">
      <input type="text" class="form-control" placeholder="Basic input">
    </div>

    <div class="input-group mb-3">
      <div class="input-group-prepend">
        <span class="input-group-text">@</span>
      </div>
      <input type="text" class="form-control" placeholder="Username">
    </div>

    <div class="mb-3">
      <input type="text" class="form-control form-control-lg" placeholder="Large input">
    </div>

    <div class="mb-3">
      <input type="text" class="form-control form-control-sm" placeholder="Small input">
    </div>

    <div class="mb-3">
      <input type="text" class="form-control rounded" placeholder="Rounded input">
    </div>

    <div class="input-group mb-3">
      <input type="text" class="form-control" placeholder="Recipient's username">
      <div class="input-group-append">
        <button class="btn btn-outline-secondary" type="button">Button</button>
      </div>
    </div>

    <div class="mb-3">
      <input type="text" class="form-control is-valid" placeholder="Valid input">
      <div class="valid-feedback">Looks good!</div>
    </div>

    <div class="mb-3">
      <input type="text" class="form-control is-invalid" placeholder="Invalid input">
      <div class="invalid-feedback">Please provide a valid input.</div>
    </div>

    <div class="form-floating mb-3">
      <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
      <label for="floatingInput">Email address</label>
    </div>

    <div class="mb-3">
      <textarea class="form-control" rows="3" placeholder="Text area"></textarea>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
